name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "third_party/**", ".gitmodules", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "third_party/**", ".gitmodules", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: aihub-backend:ci
          build-args: VERSION=${{ github.sha }}
      - name: Smoke test
        run: |
          docker run -d --name aihub -p 8080:8080 -e AIHUB_MASTER_KEY=$(openssl rand -hex 32) aihub-backend:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/readyz && exit 0; sleep 1; done
          docker logs aihub; exit 1
