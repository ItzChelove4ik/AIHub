name: backend-release

# Static Linux binaries of aihub-backend and aihub-nodectl for the VPS
# installer, with SHA256SUMS, on a backend-v* tag.
on:
  push:
    tags: ["backend-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (backend-vX.Y.Z), created on the current commit"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        run: go test -count=1 ./...
      - name: Build
        working-directory: backend
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            for cmd in aihub-backend aihub-nodectl; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X main.version=$TAG" -o ../dist/$cmd-linux-$arch ./cmd/$cmd
            done
          done
          cd ../dist && sha256sum aihub-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in backend-v*) ;; *) echo "tag must start with backend-v"; exit 1 ;; esac
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "AIHub backend ${TAG#backend-}" \
            --notes "Binaries for deploy/install.sh. Verify with SHA256SUMS."
