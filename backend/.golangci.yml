version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (net.Conn).Close
        - (*net/http.Response).Body.Close
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
